<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MUSHAF</title>
<style>
:root{
  --deep:#072A20; --green:#0B3D2E; --mid:#12614A;
  --gold:#D4AF37; --gold2:#F0D77A; --paper:#FBF6E6; --ink:#1d2b24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--deep);color:#fff;
  font-family:"Noto Naskh Arabic","Droid Arabic Naskh","Droid Naskh",serif}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 38%,var(--mid) 0%,var(--green) 45%,var(--deep) 100%);
  transition:opacity .9s ease,visibility .9s}
#splash.hide{opacity:0;visibility:hidden}
.logo{width:210px;height:210px;overflow:visible}
.glow{transform-box:view-box;transform-origin:54px 54px;animation:glow 2.4s ease-in-out infinite alternate}
.ring{stroke-dasharray:330;stroke-dashoffset:330;animation:draw 1.6s .1s ease-out forwards}
.pgL,.pgR{transform-box:view-box;transform-origin:54px 62px;opacity:0}
.pgL{animation:open 1s .5s cubic-bezier(.2,.8,.2,1) forwards}
.pgR{animation:open 1s .7s cubic-bezier(.2,.8,.2,1) forwards}
.spine{opacity:0;animation:fade .5s 1.2s forwards}
.cres{transform-box:view-box;transform-origin:54px 31px;opacity:0;animation:drop 1.1s 1.1s cubic-bezier(.2,.9,.3,1.2) forwards}
.star{transform-box:view-box;transform-origin:64px 31px;opacity:0;animation:pop .7s 1.9s ease-out forwards,twinkle 1.8s 2.6s ease-in-out infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes open{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@keyframes fade{to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-22px) rotate(-120deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
@keyframes twinkle{50%{opacity:.45;transform:scale(.8)}}
@keyframes glow{from{opacity:.25;transform:scale(.9)}to{opacity:.6;transform:scale(1.1)}}

.brand{margin-top:10px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:40px;letter-spacing:.34em;
  padding-inline-start:.34em;color:var(--gold2);direction:ltr;display:flex}
.brand span{opacity:0;transform:translateY(14px);animation:rise .6s forwards}
.brand span:nth-child(1){animation-delay:2.0s}.brand span:nth-child(2){animation-delay:2.1s}
.brand span:nth-child(3){animation-delay:2.2s}.brand span:nth-child(4){animation-delay:2.3s}
.brand span:nth-child(5){animation-delay:2.4s}.brand span:nth-child(6){animation-delay:2.5s}
@keyframes rise{to{opacity:1;transform:none}}
.tag{margin-top:6px;font-size:20px;color:#cfe3d9;opacity:0;animation:fade .8s 2.9s forwards}
.by{position:absolute;bottom:34px;font-size:14px;color:#8fb3a2;letter-spacing:.08em;opacity:0;animation:fade .8s 3.2s forwards;direction:ltr}
.bar{position:absolute;bottom:20px;width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);animation:load 4.1s .2s linear forwards}
@keyframes load{to{width:100%}}

/* ---------- App ---------- */
#app{min-height:100vh;background:var(--deep)}
header.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 16px;
  background:var(--green);border-bottom:2px solid var(--gold)}
header.top h1{margin:0;font-size:20px;font-weight:700;flex:1;color:var(--gold2)}
.btn{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:16px;background:rgba(255,255,255,.1);color:#fff}
.btn:active{background:rgba(255,255,255,.22)}
.wrap{padding:14px 14px 40px;max-width:720px;margin:0 auto}
input.search{width:100%;padding:13px 16px;border-radius:12px;border:1px solid rgba(212,175,55,.5);
  background:var(--green);color:#fff;font:inherit;font-size:17px;outline:none}
input.search:focus{border-color:var(--gold2)}
.resume{display:block;width:100%;margin:12px 0 4px;padding:14px;border-radius:12px;border:0;text-align:start;
  background:linear-gradient(120deg,var(--gold),var(--gold2));color:var(--deep);font:inherit;font-size:18px;font-weight:700}
ul.list{list-style:none;margin:12px 0 0;padding:0}
ul.list li{display:flex;align-items:center;gap:14px;padding:13px 6px;border-bottom:1px solid rgba(255,255,255,.08);font-size:20px}
ul.list li:active{background:rgba(255,255,255,.06)}
.num{min-width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  border:1.5px solid var(--gold);color:var(--gold2);font-size:16px}
.empty{padding:26px 6px;color:#9db8ab}

/* Reader */
.page{background:var(--paper);color:var(--ink);border-radius:14px;margin:14px;padding:22px 18px 28px;
  box-shadow:0 0 0 2px var(--gold) inset}
.bsm{text-align:center;font-size:26px;margin-bottom:14px;color:#14573f}
.text{text-align:justify;line-height:2.4}
.ay{border-radius:6px;padding:2px 0}
.ay.on{background:rgba(212,175,55,.35)}
.end{color:#14573f;font-size:.8em;white-space:nowrap}
.note{background:rgba(11,61,46,.08);padding:14px;border-radius:10px;line-height:1.9;font-size:18px}
.hint{text-align:center;color:#9db8ab;font-size:14px;margin:6px 0 0}

/* About */
.card{background:var(--green);border:1px solid rgba(212,175,55,.45);border-radius:14px;padding:20px;margin-top:14px;line-height:1.9}
.card h2{margin:0 0 6px;font-size:18px;color:var(--gold2)}
.card p{margin:0;font-size:18px}
.card a{color:var(--gold2);font-size:22px;direction:ltr;unicode-bidi:embed;display:inline-block}
.mini{width:110px;height:110px;display:block;margin:6px auto 0}
.center{text-align:center}

@media (prefers-reduced-motion:reduce){
  #splash *{animation-duration:.01s!important;animation-delay:0s!important}
}
</style>
</head>
<body>

<!-- ======= Splash ======= -->
<div id="splash">
  <svg class="logo" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg" aria-label="MUSHAF">
    <defs>
      <radialGradient id="g" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#F0D77A" stop-opacity=".9"/>
        <stop offset="1" stop-color="#F0D77A" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle class="glow" cx="54" cy="54" r="46" fill="url(#g)"/>
    <circle class="ring" cx="54" cy="54" r="52" fill="none" stroke="#D4AF37" stroke-width="1.6" transform="rotate(-90 54 54)"/>
    <path class="pgL" d="M54,74 L28,67 L28,44 L54,51 Z" fill="#F0D77A"/>
    <path class="pgR" d="M54,74 L80,67 L80,44 L54,51 Z" fill="#D4AF37"/>
    <path class="spine" d="M53,51 L55,51 L55,74 L53,74 Z" fill="#0B3D2E"/>
    <path class="cres" d="M58,22 A9,9 0 0 0 58,40 A12,12 0 0 1 58,22 Z" fill="#D4AF37"/>
    <path class="star" d="M64,28 l1.5,3.2 3.4,0.4 -2.5,2.4 0.7,3.4 -3.1,-1.7 -3.1,1.7 0.7,-3.4 -2.5,-2.4 3.4,-0.4 Z" fill="#F0D77A"/>
  </svg>
  <div class="brand"><span>M</span><span>U</span><span>S</span><span>H</span><span>A</span><span>F</span></div>
  <div class="tag">المصحف الشريف</div>
  <div class="by">by rFM</div>
  <div class="bar"><i></i></div>
</div>

<div id="app"></div>

<script src="quran-data.js"></script>
<script>
const NAMES=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

const DEV_NAME="rFM", DEV_PHONE="+201027814323";
const Q=window.QURAN||{};
const toAr=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

let view="home", cur=1, fs=store.get("fs",28);
const app=document.getElementById("app");

function go(v,s){ view=v; if(s) cur=s; render(); window.scrollTo(0,0); }

function listHTML(q){
  q=(q||"").trim();
  const items=NAMES.map((n,i)=>({n,i:i+1})).filter(x=>!q||x.n.includes(q)||String(x.i)===q);
  if(!items.length) return '<div class="empty">لا توجد سورة بهذا الاسم.</div>';
  return '<ul class="list">'+items.map(x=>
    `<li onclick="go('reader',${x.i})"><span class="num">${toAr(x.i)}</span><span>سورة ${x.n}</span></li>`).join("")+'</ul>';
}

function render(){
  if(view==="home") return renderHome();
  if(view==="reader") return renderReader();
  return renderAbout();
}

function renderHome(){
  const last=store.get("last",null);
  app.innerHTML=
   `<header class="top"><h1>MUSHAF · المصحف</h1><button class="btn" onclick="go('about')">المطور</button></header>
    <div class="wrap">
      <input class="search" id="q" type="search" placeholder="ابحث عن سورة أو رقمها" autocomplete="off">
      ${last?`<button class="resume" onclick="go('reader',${last.s})">متابعة القراءة: سورة ${NAMES[last.s-1]} — آية ${toAr(last.a)}</button>`:""}
      <div id="list">${listHTML("")}</div>
    </div>`;
  document.getElementById("q").addEventListener("input",e=>{
    document.getElementById("list").innerHTML=listHTML(e.target.value);
  });
}

function renderReader(){
  const last=store.get("last",null);
  const v=Q[cur];
  let body;
  if(!v){
    body='<div class="note">نص هذه السورة غير مضاف بعد. ضع ملف <b>quran-data.js</b> الكامل داخل مجلد assets ثم أعد بناء التطبيق (الخطوات في README).</div>';
  }else{
    body=(cur!==1&&cur!==9?'<div class="bsm">بِسْمِ ٱللَّهِ ٱلرَّحْمَـٰنِ ٱلرَّحِيمِ</div>':"")+
      `<div class="text" id="txt" style="font-size:${fs}px">`+
      v.map((t,i)=>`<span class="ay${last&&last.s===cur&&last.a===i+1?" on":""}" onclick="mark(this,${cur},${i+1})">${t} <span class="end">﴿${toAr(i+1)}﴾</span></span>`).join(" ")+
      "</div>";
  }
  app.innerHTML=
   `<header class="top">
      <button class="btn" onclick="go('home')">رجوع</button>
      <h1>سورة ${NAMES[cur-1]}</h1>
      <button class="btn" onclick="size(-2)">أ-</button>
      <button class="btn" onclick="size(2)">أ+</button>
    </header>
    <div class="page">${body}</div>
    ${v?'<p class="hint">المس أي آية لحفظ موضع القراءة</p>':""}
    <div class="wrap center">
      ${cur>1?`<button class="btn" onclick="go('reader',${cur-1})">السورة السابقة</button>`:""}
      ${cur<114?`<button class="btn" onclick="go('reader',${cur+1})">السورة التالية</button>`:""}
    </div>`;
}

function mark(el,s,a){
  document.querySelectorAll(".ay.on").forEach(e=>e.classList.remove("on"));
  el.classList.add("on");
  store.set("last",{s:s,a:a});
}
function size(d){
  fs=Math.max(20,Math.min(48,fs+d)); store.set("fs",fs);
  const t=document.getElementById("txt"); if(t) t.style.fontSize=fs+"px";
}

function renderAbout(){
  app.innerHTML=
   `<header class="top"><button class="btn" onclick="go('home')">رجوع</button><h1>عن التطبيق</h1></header>
    <div class="wrap">
      <svg class="mini" viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg">
        <path d="M54,74 L28,67 L28,44 L54,51 Z" fill="#F0D77A"/>
        <path d="M54,74 L80,67 L80,44 L54,51 Z" fill="#D4AF37"/>
        <path d="M53,51 L55,51 L55,74 L53,74 Z" fill="#0B3D2E"/>
        <path d="M58,22 A9,9 0 0 0 58,40 A12,12 0 0 1 58,22 Z" fill="#D4AF37"/>
        <path d="M64,28 l1.5,3.2 3.4,0.4 -2.5,2.4 0.7,3.4 -3.1,-1.7 -3.1,1.7 0.7,-3.4 -2.5,-2.4 3.4,-0.4 Z" fill="#F0D77A"/>
      </svg>
      <div class="card center"><h2>MUSHAF</h2><p>يعمل بالكامل بدون إنترنت — الإصدار 1.0</p></div>
      <div class="card"><h2>المطور</h2><p>${DEV_NAME}</p></div>
      <div class="card"><h2>للتواصل</h2><p><a href="tel:${DEV_PHONE}">${DEV_PHONE}</a></p></div>
    </div>`;
}

window.handleBack=function(){
  if(view!=="home"){ go("home"); return true; }
  return false;
};

render();
setTimeout(()=>document.getElementById("splash").classList.add("hide"),4300);
setTimeout(()=>{const s=document.getElementById("splash"); if(s) s.remove();},5300);
</script>
</body>
</html>
